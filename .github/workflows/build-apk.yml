name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Scaffold Android Scaffolding & Install Dependencies
        working-directory: mobile
        run: |
          mkdir -p /tmp/backup
          cp -r android/app/src/main/kotlin/com/walletpro/walletpro/NotificationListenerService.kt /tmp/backup/ 2>/dev/null || true

          # Cleanly generate Android project files matching Flutter runner version
          rm -rf android
          flutter create --org com.walletpro --project-name walletpro --platforms=android .

          # Restore custom NotificationListenerService
          mkdir -p android/app/src/main/kotlin/com/walletpro/walletpro
          cp /tmp/backup/NotificationListenerService.kt android/app/src/main/kotlin/com/walletpro/walletpro/ 2>/dev/null || true

          # Inject permissions into AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_SMS" />' android/app/src/main/AndroidManifest.xml

          # Inject notification service into AndroidManifest.xml
          sed -i '/<\/application>/i \        <service android:name=".TransactionNotificationService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="false">\n            <intent-filter>\n                <action android:name="android.service.notification.NotificationListenerService" />\n            </intent-filter>\n        </service>' android/app/src/main/AndroidManifest.xml

          chmod +x android/gradlew || true
          flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Stage APK
        run: |
          mkdir -p releases
          cp mobile/build/app/outputs/flutter-apk/app-release.apk releases/walletpro-v1.0.0.apk
          ls -lh releases/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletpro-v1.0.0-apk
          path: releases/walletpro-v1.0.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" releases/walletpro-v1.0.0.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" releases/walletpro-v1.0.0.apk \
              --title "WalletPro v1.0.0" \
              --notes "Automated release of WalletPro Android APK. Direct download for Android devices."
          fi

      - name: Commit APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/walletpro-v1.0.0.apk
          if git diff --staged --quiet; then
            echo "No changes in APK binary"
          else
            git commit -m "chore: add pre-built WalletPro v1.0.0 Android APK [skip ci]"
            git push origin main
          fi
