name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Scaffold Android Scaffolding & Install Dependencies
        working-directory: mobile
        run: |
          # Backup custom Kotlin files and AndroidManifest
          mkdir -p /tmp/backup/kotlin
          cp -rf android/app/src/main/kotlin/com/walletpro/walletpro/* /tmp/backup/kotlin/
          cp -f android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml

          # Cleanly generate Android project files matching Flutter runner version
          rm -rf android
          flutter create --org com.walletpro --project-name walletpro --platforms=android .

          # Restore custom Kotlin files and AndroidManifest
          mkdir -p android/app/src/main/kotlin/com/walletpro/walletpro
          cp -rf /tmp/backup/kotlin/* android/app/src/main/kotlin/com/walletpro/walletpro/
          cp -f /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          chmod +x android/gradlew || true
          flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Sign APK with Dedicated Release Keystore
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build tools: $BUILD_TOOLS_DIR"
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks mobile/keystore/walletpro-release.jks \
            --ks-pass pass:walletpro_secure_key_2026 \
            --key-pass pass:walletpro_secure_key_2026 \
            --ks-key-alias walletpro \
            mobile/build/app/outputs/flutter-apk/app-release.apk

          $BUILD_TOOLS_DIR/apksigner verify --verbose mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Stage APK
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          mkdir -p releases
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "releases/walletpro-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "APK_NAME=walletpro-v${VERSION}.apk" >> $GITHUB_ENV
          ls -lh releases/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletpro-${{ env.VERSION }}-apk
          path: releases/${{ env.APK_NAME }}
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" "releases/$APK_NAME" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "releases/$APK_NAME" \
              --title "WalletPro $TAG" \
              --notes "WalletPro Android Release APK $TAG. Features: Tinder-style swipeable card review UI with Approve/Reject stamps, validation safeguards, Undo support, and mode toggle."
          fi

      - name: Commit APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "releases/$APK_NAME"
          if git diff --staged --quiet; then
            echo "No changes in APK binary"
          else
            git commit -m "chore: add pre-built WalletPro $TAG Android APK [skip ci]"
            git push origin main
          fi
