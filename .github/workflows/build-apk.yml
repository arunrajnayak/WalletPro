name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Scaffold Android Scaffolding & Install Dependencies
        working-directory: mobile
        run: |
          # Backup custom MainActivity and AndroidManifest with SMS reading capabilities
          mkdir -p /tmp/backup
          cp -f android/app/src/main/kotlin/com/walletpro/walletpro/MainActivity.kt /tmp/backup/MainActivity.kt
          cp -f android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml

          # Cleanly generate Android project files matching Flutter runner version
          rm -rf android
          flutter create --org com.walletpro --project-name walletpro --platforms=android .

          # Restore custom MainActivity and AndroidManifest
          mkdir -p android/app/src/main/kotlin/com/walletpro/walletpro
          cp -f /tmp/backup/MainActivity.kt android/app/src/main/kotlin/com/walletpro/walletpro/MainActivity.kt
          cp -f /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          chmod +x android/gradlew || true
          flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Sign APK with Dedicated Release Keystore
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build tools: $BUILD_TOOLS_DIR"
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks mobile/keystore/walletpro-release.jks \
            --ks-pass pass:walletpro_secure_key_2026 \
            --key-pass pass:walletpro_secure_key_2026 \
            --ks-key-alias walletpro \
            mobile/build/app/outputs/flutter-apk/app-release.apk

          $BUILD_TOOLS_DIR/apksigner verify --verbose mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Stage APK
        run: |
          mkdir -p releases
          cp mobile/build/app/outputs/flutter-apk/app-release.apk releases/walletpro-v1.2.0.apk
          ls -lh releases/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletpro-v1.2.0-apk
          path: releases/walletpro-v1.2.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.0"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" releases/walletpro-v1.2.0.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" releases/walletpro-v1.2.0.apk \
              --title "WalletPro v1.2.0" \
              --notes "WalletPro Android Release APK v1.2.0. Features: Complete removal of Budgets & Goals and Insights; fixed Home review card margins with zero button overflow; Review Card account picker sorted consistently with QuickView; persistent offline caching with stale-while-revalidate; smooth 60fps shimmer skeleton loaders."
          fi

      - name: Commit APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/walletpro-v1.2.0.apk
          if git diff --staged --quiet; then
            echo "No changes in APK binary"
          else
            git commit -m "chore: add pre-built WalletPro v1.2.0 Android APK [skip ci]"
            git push origin main
          fi
